// retro3dfx CPU-load optimizations for the .143 Voodoo5 box (1GHz Athlon).
// CS is CPU-BOUND here (profiled: 100% CPU, GPU-submit ~0% = the Voodoo5 idle-
// waits on the CPU). These cut per-frame CPU work, especially in firefights
// where "players nearby" tanks the fps. GPU/driver settings won't help fps.
// userconfig.cfg is exec'd after config.cfg and is NOT overwritten by the game.

r_dynamic "0"            // no dynamic-lightmap recompute (muzzle flashes/explosions
                         // relight surfaces on the CPU every frame) - big combat win
mp_decals "30"           // was 300; fewer bullet/blood decals = less CPU + overdraw
violence_ablood "0"      // less gore particle work
violence_hblood "0"
cl_himodels "0"          // low-detail player models (fewer verts to transform)
r_mmx "1"                // use the Athlon's MMX in the software T&L path
gl_dither "0"            // minor: skip dither on 16bpp
gl_flipmatrix "0"
fps_max "100"            // cap to the engine max for stable frame pacing (uncapped
                         // just burns CPU re-rendering; it can't exceed CPU limit)
// NOTE: vertical sync is handled at the driver level. For CS (fast-paced, fps
// matters) it is disabled via the cs_fast launcher's FX_GLIDE_SWAPINTERVAL=0 env,
// which restores ~+65% fps vs vsync-on, without changing the global driver vsync.
